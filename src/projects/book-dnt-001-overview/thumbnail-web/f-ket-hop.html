<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="base.css"><title>Thumbnail tập 3 · F</title>
<!-- Variant F (user 2026-11-09: "background sáng của E, tương phản sách của D, đối xứng của B… tương phản nhẹ cho
     background"). Light paper split into a cool grey-ivory left half and a warm ivory right half that blend in the
     middle; the real cover in the centre, its left half grey and cold, its right half in full colour, a gold seam
     between; KHÉO MIỆNG in cool slate on the left, THẬT LÒNG? in the cover's red on the right, a small HAY above the
     book. Bottom-right corner (x ≥ 980, y ≥ 600) stays empty for YouTube's duration badge. -->
<style>
#thumb{color:#22303a;background:
  radial-gradient(ellipse 30% 46% at 50% 50%,rgba(255,250,238,.9),rgba(255,250,238,0) 70%),
  linear-gradient(90deg,#dcdfdf 0%,#e6e7e3 30%,#efe9dc 50%,#f5e9cf 70%,#f1dfbb 100%)}
.grain{opacity:.34;mix-blend-mode:multiply}
.vignette{background:radial-gradient(ellipse 90% 95% at 50% 50%,transparent 62%,rgba(70,55,30,.22) 100%)}
/* a faint light spill on each side: cold daylight left, warm lamp right */
.cool{position:absolute;inset:0;background:radial-gradient(ellipse 34% 60% at 16% 46%,rgba(140,165,185,.20),transparent 70%)}
.warm{position:absolute;inset:0;background:radial-gradient(ellipse 34% 60% at 84% 46%,rgba(222,168,80,.22),transparent 70%)}
.kicker{position:absolute;left:0;right:0;top:44px;text-align:center;font-size:22px;letter-spacing:.3em;color:#6f5420}
.hay{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:50px;letter-spacing:.14em;color:#8a6420}
.side{position:absolute;top:252px;margin:0;font-size:104px;line-height:1.16}
.side span{display:block}
.left{right:832px;text-align:right;color:#2b3a44}
.right{left:832px;text-align:left;color:#a3241b}
.cover{position:absolute;left:505px;top:200px;width:270px;height:388px;border-radius:3px;overflow:hidden;
  box-shadow:0 2px 0 rgba(0,0,0,.08),0 26px 40px rgba(60,40,15,.38),0 50px 90px rgba(60,40,15,.22)}
.cover div{position:absolute;inset:0;background:url('/public/book-dnt-001-overview/thumbnail/book-cover-source.webp') center/cover}
.cover .cold{clip-path:inset(0 50% 0 0);filter:grayscale(1) brightness(.78) contrast(1.05)}
.cover .cold::after{content:'';position:absolute;inset:0;background:rgba(90,130,160,.25);mix-blend-mode:color}
.cover .lit{clip-path:inset(0 0 0 50%);filter:saturate(1.12) brightness(1.04)}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18),rgba(255,255,255,0) 35%)}
.seam{position:absolute;left:638px;top:186px;width:4px;height:416px;background:linear-gradient(180deg,transparent,#e9c77e 14%,#c99a45 86%,transparent);box-shadow:0 0 14px rgba(233,199,126,.9)}
.ink path{stroke-width:4.5}
.ink .slate{stroke:#2b3a44}.ink .red{stroke:#a3241b}
</style></head><body>
<div id="thumb" role="img" aria-label="Khéo miệng hay thật lòng? Đọc sách, hiểu mình, tập 03: Đắc nhân tâm">
  <div class="cool"></div><div class="warm"></div>
  <div class="cover"><div class="cold"></div><div class="lit"></div></div><div class="seam"></div>
  <div class="kicker">ĐỌC SÁCH, HIỂU MÌNH · TẬP 03</div>
  <div class="hay">HAY</div>
  <h1 class="side left"><span>KHÉO</span><span>MIỆNG</span></h1>
  <h1 class="side right"><span>THẬT</span><span>LÒNG?</span></h1>
  <svg class="ink" viewBox="0 0 1280 720" aria-hidden="true">
    <path class="slate" d="M300 560 Q380 600 460 560"/>
    <path class="red" d="M890 600 C842 566 840 524 866 517 C880 513 890 524 890 536 C890 524 900 513 914 517 C940 524 938 566 890 600 Z"/>
  </svg>
  <div class="grain"></div><div class="vignette"></div>
</div><script src="base.js"></script></body></html>
